<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <meta name="description" content="VIBE FIGHTERS — KOF style 2D fighting HTML app" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>VIBE FIGHTERS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-deep: #0a0e14;
  --bg-mid: #121a24;
  --neon: #ff6b1a;
  --cyan: #3de0c5;
  --blood: #e8364f;
  --gold: #f5c542;
  --panel: rgba(10, 16, 24, 0.88);
  --text: #f2f5f8;
  --muted: #8a9aab;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, #1a2838 0%, transparent 55%),
    linear-gradient(180deg, #0c121a 0%, var(--bg-deep) 100%);
  color: var(--text);
  font-family: "Noto Sans KR", sans-serif;
  overflow: hidden;
}

#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px;
}

.topbar {
  width: min(960px, 100%);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}

.logo {
  font-family: "Black Han Sans", sans-serif;
  font-size: clamp(1.4rem, 3vw, 2rem);
  letter-spacing: 0.04em;
  color: var(--text);
}

.logo span {
  color: var(--neon);
  margin-left: 4px;
}

.hint {
  font-size: 0.85rem;
  color: var(--muted);
}

#game {
  width: min(960px, 100%);
  height: auto;
  aspect-ratio: 960 / 540;
  background: #000;
  border: 2px solid #2a3a4c;
  box-shadow:
    0 0 0 1px rgba(255, 107, 26, 0.25),
    0 20px 60px rgba(0, 0, 0, 0.55);
  image-rendering: pixelated;
  display: block;
}

.overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(4, 8, 14, 0.72);
  z-index: 20;
  padding: 24px;
}

.overlay.show {
  display: flex;
}

.panel {
  width: min(720px, 100%);
  background: var(--panel);
  border: 1px solid #334455;
  padding: 28px 32px;
  backdrop-filter: blur(8px);
}

.panel h2 {
  font-family: "Black Han Sans", sans-serif;
  font-size: 1.8rem;
  margin-bottom: 8px;
}

.panel p {
  color: var(--muted);
  margin-bottom: 20px;
  line-height: 1.5;
}

.chars {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.char-card {
  border: 2px solid #3a4a5c;
  background: linear-gradient(160deg, #182230, #0e1520);
  padding: 16px 12px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s, transform 0.15s;
}

.char-card:hover,
.char-card.selected {
  border-color: var(--neon);
  transform: translateY(-2px);
}

.char-card .swatch {
  width: 48px;
  height: 64px;
  margin: 0 auto 10px;
  border-radius: 4px 4px 10px 10px;
}

.char-card .swatch-canvas {
  width: 100%;
  max-width: 140px;
  height: auto;
  aspect-ratio: 120 / 140;
  margin: 0 auto 10px;
  display: block;
  background: #0e1520;
  border: 1px solid #2a3a4c;
}

.char-card h3 {
  font-size: 1rem;
  margin-bottom: 4px;
}

.char-card .style {
  font-size: 0.75rem;
  color: var(--muted);
}

.btn {
  appearance: none;
  border: none;
  background: var(--neon);
  color: #120800;
  font-family: "Noto Sans KR", sans-serif;
  font-weight: 900;
  font-size: 1rem;
  padding: 12px 28px;
  cursor: pointer;
  letter-spacing: 0.04em;
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid #445566;
  margin-left: 8px;
}

.moves {
  max-height: 180px;
  overflow: auto;
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.55;
  border-top: 1px solid #2a3644;
  padding-top: 12px;
  margin-top: 8px;
}

.moves strong {
  color: var(--gold);
}

@media (max-width: 720px) {
  .chars {
    grid-template-columns: 1fr;
  }
  .topbar {
    flex-direction: column;
    align-items: flex-start;
  }
}


html, body {
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
.install-hint {
  width: min(960px, 100%);
  font-size: 0.75rem;
  color: var(--muted);
  text-align: right;
}

  </style>
</head>
